parameters:
    # Where preferences are kept (Enum\PreferenceStorage): a cookie, the
    # session, or the database per user (`user`, a cookie for a visitor not
    # signed in) or for everybody (`shared`, a tool without accounts).
    wexample_symfony_preference.storage: user

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyPreference\:
        resource: '../../{Controller,EventSubscriber,Repository,Service}'
